<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDH Tool - Cache Reset</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; text-align: center; line-height: 1.5; }
        .status { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 8px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Resetting Application Cache...</h1>
    <p>Please wait while we clear the old version from your browser.</p>
    <div id="status" class="status">Initializing...</div>

    <script>
        const statusEl = document.getElementById('status');
        
        async function clearCache() {
            try {
                // 1. Unregister Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    if (registrations.length > 0) {
                        for (let registration of registrations) {
                            await registration.unregister();
                            statusEl.innerHTML += `<div>Unregistered Service Worker: ${registration.scope}</div>`;
                        }
                    } else {
                        statusEl.innerHTML += `<div>No Service Workers found.</div>`;
                    }
                }

                // 2. Clear Caches API
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (let key of keys) {
                        await caches.delete(key);
                        statusEl.innerHTML += `<div>Deleted Cache: ${key}</div>`;
                    }
                }

                // 3. Clear Local Storage / Session Storage (Optional, maybe keep data?)
                // localStorage.clear(); 
                // statusEl.innerHTML += `<div>Cleared Local Storage</div>`;

                statusEl.innerHTML += `<div class="success">Done! Redirecting...</div>`;
                
                // Redirect after short delay
                setTimeout(() => {
                   window.location.href = '/?t=' + Date.now();
                }, 1500);

            } catch (e) {
                statusEl.innerHTML += `<div class="error">Error: ${e.message}</div>`;
                console.error(e);
            }
        }

        clearCache();
    </script>
</body>
</html>
